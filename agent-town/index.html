// ================== AGENCIES = cottages in town ==================
// A session lands at a building by, in order: its agent slug (`match`), its
// project folder (`folders`), or words seen in its tool activity (`hint`).
// Since most of this work happens inside one repo, `hint` on the file paths
// being touched is what actually separates the desks day to day.
//
// The FIRST entry is the catch-all: a session with no slug match working from
// a default folder walks here. Unmatched sessions from other folders wait in
// the town square, so keep the main office first.
// The desks, in western dress. Left column is what it is on the org chart:
//   Mother Lode ............ Mother — Chaz, the main brain. Also the catch-all.
//   Assay Office ........... Auditing — assayers verify what everyone else claims
//   The Apothecary ......... Slim Inc — surgical/cosmetic compliance, HIPAA, FL med law
//   Cattlemen's Exchange ... Ranch — meat prices, cattle, livestock, USDA, slaughterhouse
//   Territorial Law Office . Legal strategies
//   Marshal's Office ....... Underwriting — takedowns
//   Claim Office ........... Marketing — leads and sourcing
//   Tintype Office ......... Mugshots — a mugshot was a tintype once
//   The Gazette ............ Reviews
//
// ORDER MATTERS. agencyFor() walks this list in order and takes the first hit,
// so narrower desks sit above broader ones: Assay takes test files before
// Marshal can claim them by filename, and Marshal takes the takedown scripts
// before Tintype claims everything under mugshot_removal.
//
// The FIRST entry is the catch-all -- a session in the home folder with no
// other match walks there. That is deliberate for Mother Lode; if you reorder,
// keep the brain first.
const AGENCIES = [

   match:/chaz|mother|brain|orchestrat|conductor/i, folders:/techlawai/i,

   hint:/test_|conftest|pytest|audit|verify/i, accent:0x5ad06a},
  // Above Law on purpose: medical-legal work says "legal" too, and whoever is

  {key:'apothecary',name:'⚕ Apothecary · Slim Inc',wall:0xd6d9c8, roof:0x3a6a5a, pos:[-58,0,-34],

  {key:'tintype',   name:'◉ Tintype Office',       wall:0xd8c0a8, roof:0x5a4a6a, pos:[ 24,0, 16],

// ================== procedural textures (all original) ==================
function tex(w,h,draw,repeat=[1,1]){const cv=document.createElement('canvas');cv.width=w;cv.height=h;draw(cv.getContext('2d'),w,h);const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...repeat);t.magFilter=THREE.NearestFilter;return t;}
const T={
  grass: tex(128,128,(g,w,h)=>{g.fillStyle='#4f7a3f';g.fillRect(0,0,w,h);for(let i=0;i<260;i++){g.fillStyle=['#456d37','#587f45','#6b7a3a'][i%3];g.fillRect(Math.random()*w,Math.random()*h,3,2);}},[40,40]),
  cobble: tex(128,128,(g,w,h)=>{g.fillStyle='#6f6254';g.fillRect(0,0,w,h);for(let y=0;y<h;y+=16)for(let x=0;x<w;x+=16){g.fillStyle=['#8a7b68','#7e7060','#948570'][(x+y)%3];g.beginPath();g.ellipse(x+8+(y%32?8:0),y+8,7,5.5,0,0,Math.PI*2);g.fill();}},[10,10]),
  plank: (c1,c2)=>tex(128,128,(g,w,h)=>{g.fillStyle=c1;g.fillRect(0,0,w,h);g.fillStyle=c2;for(let y=0;y<h;y+=16){g.fillRect(0,y,w,2);g.fillRect((y*3)%w,y,2,16);}},[3,1]),
  floor: tex(128,128,(g,w,h)=>{g.fillStyle='#b8823f';g.fillRect(0,0,w,h);g.fillStyle='#8a5e2a';for(let y=0;y<h;y+=16){g.fillRect(0,y,w,2);g.fillRect((y*5)%w,y,2,16);}},[4,3]),
  checker: tex(128,128,(g,w,h)=>{for(let y=0;y<h;y+=32)for(let x=0;x<w;x+=32){g.fillStyle=((x+y)/32)%2?'#8a5e2a':'#e8d8b8';g.fillRect(x,y,32,32);}},[4,3]),
  thatch: tex(128,128,(g,w,h)=>{g.fillStyle='#a8843c';g.fillRect(0,0,w,h);g.strokeStyle='#7d5f26';g.lineWidth=2;for(let i=0;i<70;i++){const x=Math.random()*w,y=Math.random()*h;g.beginPath();g.moveTo(x,y);g.lineTo(x+6,y+14);g.stroke();}},[4,2]),
  rug: tex(128,128,(g,w,h)=>{g.fillStyle='#a34a4a';g.fillRect(0,0,w,h);g.strokeStyle='#e8c98a';g.lineWidth=6;g.strokeRect(10,10,w-20,h-20);g.fillStyle='#e8c98a';g.beginPath();g.ellipse(w/2,h/2,26,18,0,0,Math.PI*2);g.fill();},[1,1]),
  water: tex(128,128,(g,w,h)=>{g.fillStyle='#4f7f7a';g.fillRect(0,0,w,h);g.fillStyle='#6fa39c';for(let i=0;i<40;i++){g.beginPath();g.ellipse(Math.random()*w,Math.random()*h,10,3,0,0,Math.PI*2);g.fill();}},[2,2]),
};
const grad=new THREE.DataTexture(new Uint8Array([70,130,200,255]),4,1,THREE.LuminanceFormat); grad.minFilter=grad.magFilter=THREE.NearestFilter; grad.needsUpdate=true;
const toon=(o)=>new THREE.MeshToonMaterial({gradientMap:grad,...o});

// ================== scene: dusk, cozy ==================
const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x17132a); scene.fog=new THREE.Fog(0x1c1834,90,190);
const camera=new THREE.PerspectiveCamera(48,1,0.1,400);

scene.add(new THREE.HemisphereLight(0x5a5aa8,0x1a1410,0.45));
const moonLight=new THREE.DirectionalLight(0x9fb4ff,0.5); moonLight.position.set(50,60,-70); moonLight.castShadow=true; moonLight.shadow.mapSize.set(2048,2048); Object.assign(moonLight.shadow.camera,{left:-90,right:90,top:90,bottom:-90,far:220}); scene.add(moonLight);
{const m=new THREE.Mesh(new THREE.SphereGeometry(7,20,16),glow(0xfff1c2)); m.position.set(70,75,-110); scene.add(m);
 const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:tex(128,128,(g,w,h)=>{const r=g.createRadialGradient(64,64,10,64,64,64);r.addColorStop(0,'rgba(255,230,170,.55)');r.addColorStop(1,'rgba(255,230,170,0)');g.fillStyle=r;g.fillRect(0,0,w,h);}),transparent:true,depthWrite:false})); halo.scale.set(40,40,1); halo.position.copy(m.position); scene.add(halo);}
function lamp(color,intensity,dist,x,y,z){const l=new THREE.PointLight(color,intensity,dist,2); l.position.set(x,y,z); scene.add(l); return l;}

// ground, paths
const ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220),toon({map:T.grass})); ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function path(w,h,x,z){const p=new THREE.Mesh(new THREE.PlaneGeometry(w,h),toon({map:T.cobble}));p.rotation.x=-Math.PI/2;p.position.set(x,0.03,z);p.receiveShadow=true;scene.add(p);}

for(const a of AGENCIES) path(4,12,a.pos[0],a.pos[2]+(a.pos[2]<0?10:-10));

// helpers
function box(w,h,d,mat,x,y,z,cast=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=cast;m.receiveShadow=true;return m;}
function cyl(rt,rb,h,mat,x,y,z,seg=12){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);m.position.set(x,y,z);m.castShadow=true;return m;}
function gableRoof(w,d,h,color){const s=new THREE.Shape(); s.moveTo(-w/2,0); s.lineTo(w/2,0); s.lineTo(0,h); s.closePath();
  const g=new THREE.ExtrudeGeometry(s,{depth:d,bevelEnabled:false}); g.translate(0,0,-d/2); const m=new THREE.Mesh(g,toon({map:T.thatch,color,transparent:true,opacity:.1,depthWrite:false})); return m;}
// multi-line label sprite: lines = [{t, px, c}]
function label(lines,bg='#2b1d12',border='#c98a3a'){if(typeof lines==='string') lines=[{t:lines,px:26,c:'#f5e6c8'}];
  const cv=document.createElement('canvas');const ctx=cv.getContext('2d'); const f=l=>`bold ${l.px}px "Segoe UI Rounded","Segoe UI",sans-serif`;
  let w=0,h=16; for(const l of lines){ctx.font=f(l);w=Math.max(w,ctx.measureText(l.t).width);h+=l.px+6;} w+=28; cv.width=w; cv.height=h;
  const r=12; ctx.fillStyle=bg; ctx.strokeStyle=border; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(r,2); ctx.lineTo(w-r,2); ctx.quadraticCurveTo(w-2,2,w-2,r); ctx.lineTo(w-2,h-r); ctx.quadraticCurveTo(w-2,h-2,w-r,h-2); ctx.lineTo(r,h-2); ctx.quadraticCurveTo(2,h-2,2,h-r); ctx.lineTo(2,r); ctx.quadraticCurveTo(2,2,r,2); ctx.closePath(); ctx.fill(); ctx.stroke();
  let y=10; ctx.textAlign='center'; ctx.textBaseline='top'; for(const l of lines){ctx.font=f(l); ctx.fillStyle=l.c; ctx.fillText(l.t,w/2,y); y+=l.px+6;}
  const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(cv),transparent:true,depthTest:false})); sp.scale.set(w/30,h/30,1); sp.userData.h=h/30; return sp;}
const LEAF=[0x3f6b32,0x9a5a1e,0xb8471f,0xc98a2a,0x4f7a3f];
function tree(x,z,s=1){const t=new THREE.Group();const k=box(.6*s,1.4*s,.6*s,toon({color:0x4a2c16}),0,.7*s,0);const c=LEAF[Math.floor(Math.random()*LEAF.length)];const c1=new THREE.Mesh(new THREE.SphereGeometry(1.9*s,10,8),toon({color:c}));c1.position.y=2.6*s;c1.castShadow=true;const c2=new THREE.Mesh(new THREE.SphereGeometry(1.4*s,10,8),toon({color:c}));c2.position.set(.8*s,3.4*s,.4*s);c2.castShadow=true;t.add(k,c1,c2);t.position.set(x,0,z);scene.add(t);}

function flowers(x,z,n=6){for(let i=0;i<n;i++){const f=new THREE.Mesh(new THREE.SphereGeometry(.28,8,6),toon({color:[0xc9552a,0xd9a23a,0xe0d0b0,0x8a4fb0][i%4]}));f.position.set(x+(Math.random()-.5)*3,.35,z+(Math.random()-.5)*1.6);scene.add(f);}}

  g.add(box(.18*s,.35*s,.18*s,toon({color:0x3f5a22}),0,1.35*s,0,false));

const bats=[]; function bat(){const g=new THREE.Group(); const m=glow(0x0a0710); const w1=new THREE.Mesh(new THREE.ConeGeometry(.5,1.4,3),m); w1.rotation.z=Math.PI/2; w1.position.x=-.7; const w2=w1.clone(); w2.rotation.z=-Math.PI/2; w2.position.x=.7; g.add(w1,w2,new THREE.Mesh(new THREE.SphereGeometry(.25,6,6),m)); g.userData={cx:(Math.random()-.5)*90,cz:(Math.random()-.5)*60-10,r:6+Math.random()*14,y:9+Math.random()*10,ph:Math.random()*6,sp:.4+Math.random()*.5}; scene.add(g); bats.push(g); return g;}

    const ch=new THREE.Mesh(new THREE.SphereGeometry(.13,8,8),toon({color:0xff9a9a})); ch.position.set(sx*.58,1.98,.7); g.add(ch);}
  g.add(box(.22,.07,.05,toon({color:0x8a3a3a}),0,1.88,.93,false));
  const a1=new THREE.Mesh(new THREE.CylinderGeometry(.13,.13,.7,8),shirtM); a1.position.set(-.6,1.0,0); a1.rotation.z=.25; const a2=a1.clone(); a2.position.x=.6; a2.rotation.z=-.25;
  const legM=toon({color:preset.outfit==='overalls'?preset.oc:0x3a2f2a}); const l1=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,.5,8),legM); l1.position.set(-.22,.25,0); const l2=l1.clone(); l2.position.x=.22;
  const b1=box(.36,.18,.42,toon({color:0x4a2a14}),-.22,.08,.05,false), b2=b1.clone(); b2.position.x=.22;
  g.add(a1,a2,l1,l2,b1,b2); g.userData={legs:[l1,l2],arms:[a1,a2],scarf}; return g;}

// ================== identity + agents ==================
let nameBook={}; try{nameBook=JSON.parse(localStorage.getItem('town-names')||'{}');}catch(e){}
function townName(id){if(!nameBook[id]){const used=new Set(Object.values(nameBook)); nameBook[id]=NAMES.find(n=>!used.has(n))||NAMES[Number(id)%NAMES.length]; try{localStorage.setItem('town-names',JSON.stringify(nameBook));}catch(e){}} return nameBook[id];}
function identity(a){ if(a.name){ for(const [re,n,r] of ROLES) if(re.test(a.name)) return {name:n,role:r}; const p=a.name.split(/[-_ ]/); return {name:p[0][0].toUpperCase()+p[0].slice(1),role:p.slice(1).join(' ')||'Agent'}; }
  const b=a.agency?buildings[a.agency]:null; return {name:townName(a.id),role:b?(a.folder&&!HOME_FOLDER.test(a.folder)?a.folder:'Coordinator'):`Visitor · ${a.folder||'?'}`}; }
const ACTIVITY=[['home',34],['coffee',20],['park',14],['spring',12],['rec',12],['library',8]];
const ACT_LABEL={home:'resting at home',coffee:'at the café',park:'by the campfire',spring:'in the hot spring',rec:'in the rec room',library:'in the reading nook'};
const agents=new Map(); let homeIdx=0;
function agencyFor(name,folder,hint){
  for(const a of AGENCIES){if(name&&a.match.test(name))return a.key;}
  for(const a of AGENCIES){if(hint&&a.hint.test(hint))return a.key;}
  for(const a of AGENCIES){if(folder&&a.key!==AGENCIES[0].key&&a.folders.test(folder))return a.key;}
  if(!folder||HOME_FOLDER.test(folder)) return AGENCIES[0].key;
  return null;}
function freeSeat(seats,id,key){const taken=new Set([...agents.values()].filter(a=>a.id!==id&&a.spot&&a.spot.key===key).map(a=>a.spot.i)); for(let i=0;i<seats.length;i++) if(!taken.has(i)) return i; return null;}
function recolor(a){const ag=a.agency?buildings[a.agency]:null; a.mesh.userData.scarf.material.color.set(ag?ag.accent:0x9e9e9e);}
function upsert(id,patch={}){let a=agents.get(id); if(!a){const n=Number(id)||agents.size; a={id,name:null,folder:null,status:'waiting',tool:null,agency:null,spot:null,activity:null,activityUntil:0,homeI:homeIdx++%homes.length}; a.home=homes[a.homeI].clone(); a.mesh=makeChar(PRESETS[n%PRESETS.length],SKIN[(n*7)%SKIN.length]); a.mesh.position.copy(a.home); a.mesh.rotation.y=Math.PI; scene.add(a.mesh); agents.set(id,a);}
  Object.assign(a,patch);
  const key=agencyFor(a.name,a.folder,a.hint); if(key!==a.agency){a.agency=key; a.spot=null; recolor(a);}
  const who=identity(a); a.who=who; const lines=[{t:who.name,px:26,c:'#f5e6c8'},{t:who.role,px:17,c:'#d9b57a'}]; if(a.tool) lines.push({t:a.statusText||a.tool,px:15,c:'#9fd0ff'});
  const sig=lines.map(l=>l.t).join('|'); if(a.lblSig!==sig){if(a.lbl) a.mesh.remove(a.lbl); a.lbl=label(lines,a.tool?'#1f2a3f':'#2b1d12',a.tool?'#5a86b8':'#c98a3a'); a.lbl.position.y=3.9+a.lbl.userData.h/2; a.mesh.add(a.lbl); a.lblSig=sig;}
  if(patch.status==='active'||patch.tool) a.lastActive=Date.now();
  retarget(a); renderPanel();
}
function isWorking(a){return a.status==='active'||!!a.tool||(Date.now()-(a.lastActive||0)<45000);}
function retarget(a){const working=isWorking(a), now=Date.now();
  if(working&&a.agency){ if(a.activity!=='work'){a.activity='work'; a.spot=null;} const b=buildings[a.agency]; if(!a.spot){const i=freeSeat(b.seats,a.id,a.agency); if(i!=null) a.spot={key:a.agency,i};} const s=a.spot?b.seats[a.spot.i]:null; a.target=s?s.pos:new THREE.Vector3(b.pos[0],0,b.pos[2]+9); a.yaw=s?s.yaw:0; return; }
  if(working){ a.activity='work'; a.spot=null; a.target=new THREE.Vector3(PLAZA[0]+(a.id%7-3)*2,0,PLAZA[2]+8); a.yaw=0; return; }
  // off duty: rest at home or hang out around town, switching every 30–90 s
  if(a.activity==='work'||!a.activity||now>a.activityUntil){
    let r=Math.random()*100, pick='home'; for(const [k,w] of ACTIVITY){ if(r<w){pick=k;break;} r-=w; }
    a.spot=null; if(pick!=='home'){const v=VENUES[pick]; const i=freeSeat(v.seats,a.id,pick); if(i!=null) a.spot={key:pick,i}; else pick='home';}
    a.activity=pick; a.activityUntil=now+30000+Math.random()*60000;
    if(pick==='home'){const h=homeInside[a.homeI]; a.target=h.pos; a.yaw=h.yaw;} else {const s=VENUES[pick].seats[a.spot.i]; a.target=s.pos; a.yaw=s.yaw;} }}
function removeAgent(id){const a=agents.get(id); if(!a) return; scene.remove(a.mesh); agents.delete(id); renderPanel();}

// ================== live feed from the pixel office (via serve.py relay) ==================
const conn=document.getElementById('conn');
async function connect(){
  let token='';
  try{const t=await (await fetch('/token.json')).json(); token=t.token||'';}catch(e){}
  const ws=new WebSocket(`ws://${location.host}/ws${token?`?token=${encodeURIComponent(token)}`:''}`);
  ws.onopen=()=>{conn.textContent='● live — the town is connected to the office'; conn.style.color='#8ad07a'; try{ws.send(JSON.stringify({type:'webviewReady'}));}catch(e){}};
  ws.onclose=()=>{conn.textContent='○ office offline — retrying…'; conn.style.color='#ff8a5a'; setTimeout(connect,3000);};
  ws.onmessage=(ev)=>{let m; try{m=JSON.parse(ev.data);}catch(e){return;} handle(m);};
}
function handle(m){
  switch(m.type){
    case 'existingAgents': (m.agents||[]).forEach(id=>{const meta=(m.agentMeta&&m.agentMeta[id])||{}; upsert(id,{name:meta.teammateName||meta.agentName||meta.terminalName||null,folder:(m.folderNames&&m.folderNames[id])||meta.folderName||DEFAULT_FOLDER,status:'waiting'});}); break;
    case 'agentCreated': upsert(m.id,{name:m.teammateName||m.agentName||null,folder:m.folderName||DEFAULT_FOLDER,status:'active'}); break;
    case 'agentTeamInfo': upsert(m.id,{name:m.agentName||undefined}); break;
    case 'agentStatus': upsert(m.id,{status:m.status}); break;
    case 'agentToolStart': { const st=(m.status||'').replace(/^(Using|Running:)\s*/,'').replace(/^mcp__.*?__(?=[a-z])/,'').slice(0,34); upsert(m.id,{tool:m.toolName||'working',statusText:st,hint:m.status||m.toolName||'',status:'active'}); break; }
    case 'agentToolDone': upsert(m.id,{tool:null,statusText:null}); break;
    case 'agentToolsClear': upsert(m.id,{tool:null,statusText:null}); break;
    case 'subagentToolStart': upsert(m.id,{tool:'working',status:'active'}); break;
    case 'subagentClear': upsert(m.id,{tool:null,status:'waiting'}); break;
    case 'agentClosed': removeAgent(m.id); break;
  }
}

// ================== roster panel + fly-to ==================
const panel=document.getElementById('panel');
function renderPanel(){
  let h='';
  const row=(a,cls)=>`<div class="a ${cls}"><span class="who">${a.who.name}</span><span class="role">${a.who.role}</span><div class="tool">${isWorking(a)?(a.statusText||a.tool||'active'):(ACT_LABEL[a.activity]||'off duty')}</div></div>`;
  for(const b of Object.values(buildings)){
    const inside=[...agents.values()].filter(a=>a.agency===b.key);
    const working=inside.filter(a=>isWorking(a)), off=inside.filter(a=>!isWorking(a));
    h+=`<div class="b" style="border-color:${hexTo(b.accent)}" data-k="${b.key}"><b>${b.name}</b><span class="n">${working.length} working · ${off.length} off duty</span>`;
    for(const a of working) h+=row(a,''); for(const a of off) h+=row(a,'home'); h+=`</div>`;
  }
  const un=[...agents.values()].filter(a=>!a.agency);
  if(un.length) h+=`<div class="b" style="border-color:#9e9e9e"><b>Town square (visitors)</b><span class="n">${un.length}</span>`+un.map(a=>row(a,isWorking(a)?'':'home')).join('')+`</div>`;
  panel.innerHTML=h||'<div class="n">no one in town yet</div>';
  panel.querySelectorAll('.b[data-k]').forEach(el=>el.onclick=()=>focusBuilding(el.dataset.k));
}
function focusBuilding(key){const b=buildings[key]; if(!b) return; cam.target.set(b.pos[0],2,b.pos[2]); cam.r=Math.min(cam.r,36);}

// ================== input ==================
let drag=null; canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:false};});
window.addEventListener('pointermove',e=>{if(!drag) return; const dx=e.clientX-drag.x,dy=e.clientY-drag.y; if(Math.abs(dx)+Math.abs(dy)>3) drag.moved=true; if(e.buttons&2){cam.target.x-=dx*0.05*Math.cos(cam.theta);cam.target.z+=dx*0.05*Math.sin(cam.theta);cam.target.y=Math.max(0,cam.target.y+dy*0.03);} else {cam.theta-=dx*0.006; cam.phi=Math.min(1.45,Math.max(0.25,cam.phi-dy*0.006));} drag.x=e.clientX; drag.y=e.clientY;});
window.addEventListener('pointerup',e=>{ if(drag&&!drag.moved) pick(e); drag=null; });
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('wheel',e=>{cam.r=Math.min(160,Math.max(12,cam.r*(e.deltaY>0?1.1:0.9)));},{passive:true});
window.addEventListener('keydown',e=>{if(e.key==='h'||e.key==='H') panel.style.display=panel.style.display==='none'?'':'none';});
const ray=new THREE.Raycaster(), ndc=new THREE.Vector2();
function pick(e){ndc.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1); ray.setFromCamera(ndc,camera); const hits=ray.intersectObjects(Object.values(buildings).map(b=>b.body)); if(hits.length){const key=Object.values(buildings).find(b=>b.body===hits[0].object).key; focusBuilding(key);}}

// ================== clock + loops ==================
function clock(){const d=new Date(); const m=d.getMonth(); document.getElementById('season').textContent=['Winter','Winter','Spring','Spring','Spring','Summer','Summer','Summer','Fall','Fall','Fall','Winter'][m]+' 🎃'; document.getElementById('time').textContent=d.toLocaleTimeString([], {hour:'numeric',minute:'2-digit'}); document.getElementById('day').textContent=d.toLocaleDateString([], {weekday:'short',day:'numeric'});}
setInterval(clock,10000); clock();
function resize(){const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix();} addEventListener('resize',resize); resize();
let lastSim=performance.now(), lastRetarget=0;
function simulate(){const now=performance.now(); const dt=Math.min(1.0,(now-lastSim)/1000); lastSim=now;
  if(now-lastRetarget>2000){lastRetarget=now; for(const a of agents.values()) retarget(a); renderPanel();}
  for(const a of agents.values()){ if(!a.target) continue; const p=a.mesh.position, t=a.target; const d=new THREE.Vector3(t.x-p.x,0,t.z-p.z); const dist=d.length(); const {legs,arms}=a.mesh.userData;
    if(dist>0.15){ d.normalize(); const step=Math.min(dist,7*dt); p.x+=d.x*step; p.z+=d.z*step; a.mesh.rotation.y=Math.atan2(d.x,d.z); const s=Math.sin(now/90); a.mesh.position.y=Math.abs(s)*0.12; legs[0].rotation.x=s*.7; legs[1].rotation.x=-s*.7; arms[0].rotation.x=-s*.5; arms[1].rotation.x=s*.5; }
    else { a.mesh.position.y=0; legs[0].rotation.x=legs[1].rotation.x=arms[0].rotation.x=arms[1].rotation.x=0; a.mesh.rotation.y=a.yaw??Math.PI; } }}
setInterval(simulate,50);
function tick(){const t=performance.now()/1000; for(const b of bats){const u=b.userData; b.position.set(u.cx+Math.cos(t*u.sp+u.ph)*u.r,u.y+Math.sin(t*2+u.ph)*1.5,u.cz+Math.sin(t*u.sp+u.ph)*u.r); b.rotation.y=-(t*u.sp+u.ph); b.children[0].rotation.y=Math.sin(t*14)*.6; b.children[1].rotation.y=-Math.sin(t*14)*.6;}
  for(const g of ghosts){const u=g.userData; g.position.set(u.x+Math.sin(t*.5+u.ph)*2,2+Math.sin(t*1.3+u.ph)*.6,u.z+Math.cos(t*.4+u.ph)*2); g.rotation.y=Math.sin(t*.7+u.ph);}
  if(fire.light){fire.light.intensity=1.6+Math.sin(t*9)*.25+Math.sin(t*23)*.15; fire.mesh.scale.y=1+Math.sin(t*11)*.12;}
  placeCam(); renderer.render(scene,camera); requestAnimationFrame(tick);}
requestAnimationFrame(tick); connect(); renderPanel();
</script></body></html>
